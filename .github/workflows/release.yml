name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - stable
      repo_filter:
        description: 'Repository filter (optional, leave empty for all)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      repo_names: ${{ steps.set-matrix.outputs.repo_names }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get repository list
        id: set-matrix
        run: |
          REPO_COUNT=$(yq e '.repositories | length' release-config.yml)
          
          INDICES="["
          NAMES="["
          for ((i=0; i<$REPO_COUNT; i++)); do
            NAME=$(yq e ".repositories[$i].name" release-config.yml)
            FILTER="${{ github.event.inputs.repo_filter }}"
            if [ -n "$FILTER" ] && [[ "$NAME" != *"$FILTER"* ]]; then
              echo "Skipping $NAME (filter: $FILTER)"
              continue
            fi
            if [ $i -eq 0 ]; then
              INDICES="${INDICES}$i"
              NAMES="${NAMES}\"$NAME\""
            else
              INDICES="${INDICES},$i"
              NAMES="${NAMES},\"$NAME\""
            fi
          done
          INDICES="${INDICES}]"
          NAMES="${NAMES}]"
          
          echo "matrix={\"repository\":$INDICES}" >> $GITHUB_OUTPUT
          echo "repo_names=$NAMES" >> $GITHUB_OUTPUT

  release:
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"repository":[]}'
    strategy:
      matrix: 
        repository: ${{ fromJson(needs.prepare.outputs.matrix).repository }}
      max-parallel: 1
      fail-fast: false
    runs-on: ubuntu-latest
    name: ${{ fromJson(needs.prepare.outputs.repo_names)[matrix.repository] }}
    
    steps:
      - name: Load Configuration
        id: config
        run: |
          REPO_INDEX=${{ matrix.repository }}
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"
          
          NAME=$(yq e ".repositories[$REPO_INDEX].name" release-config.yml)
          REPO_PATH=$(yq e ".repositories[$REPO_INDEX].path" release-config.yml)
          ENABLED=$(yq e ".repositories[$REPO_INDEX].release.$RELEASE_TYPE.enabled" release-config.yml)
          
          if [ "$ENABLED" != "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Repository $NAME ($RELEASE_TYPE) is disabled, skipping"
            exit 0
          fi
          
          BRANCH=$(yq e ".repositories[$REPO_INDEX].release.$RELEASE_TYPE.branch" release-config.yml)
          PRERELEASE=$(yq e ".repositories[$REPO_INDEX].release.$RELEASE_TYPE.prerelease // true" release-config.yml)
          
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "repo_path=$REPO_PATH" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          
          echo "📦 准备发布: $NAME"
          echo "🔖 分支: $BRANCH"
          echo "🏷️ 类型: $RELEASE_TYPE"

      - name: Checkout repository
        if: steps.config.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.config.outputs.repo_path }}
          ref: ${{ steps.config.outputs.branch }}
          path: repo
          fetch-depth: 0

      - name: Read version and changelog
        if: steps.config.outputs.skip != 'true'
        id: version
        run: |
          cd repo
          
          # 读取版本号
          VERSION=$(grep -oP '(?<=version = ")[^"]+' _meta.lua | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          
          # 读取 changelog
          if [ -f "changelog.lua" ]; then
            sed -n "/\[\"$VERSION\"\] = {/,/},/p" changelog.lua | sed 's/^[[:space:]]*"//;s/",\?$//' > ../release_notes.md
          else
            echo "## What's Changed" > ../release_notes.md
            echo "" >> ../release_notes.md
            echo "_No changelog entries for this version._" >> ../release_notes.md
          fi
          
          echo "📌 版本: $VERSION"

      - name: Build plugin zip
        if: steps.config.outputs.skip != 'true'
        run: |
          cd repo
          mkdir -p dist
          zip -r dist/${{ steps.config.outputs.name }}.zip . \
            -x "*.git*" \
            -x ".github/*" \
            -x "dist/*" \
            -x "*.zip" \
            -x "picture/*"
          echo "📦 打包完成"

      - name: Create Release
        if: steps.config.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repo
          TAG="${{ steps.version.outputs.tag }}"
          
          # 如果是 beta 版本，添加 beta 序号
          if [ "${{ steps.config.outputs.prerelease }}" = "true" ]; then
            # 获取最大的 beta 序号
            MAX_BETA=0
            for t in $(git tag -l "v${{ steps.version.outputs.version }}-beta.*"); do
              num=$(echo "$t" | grep -oP 'beta\.\K\d+')
              if [ -n "$num" ] && [ "$num" -gt "$MAX_BETA" ]; then
                MAX_BETA=$num
              fi
            done
            N=$((MAX_BETA + 1))
            TAG="v${{ steps.version.outputs.version }}-beta.$N"
          fi
          
          gh release create "$TAG" \
            dist/${{ steps.config.outputs.name }}.zip \
            --repo "${{ steps.config.outputs.repo_path }}" \
            --title "$TAG" \
            --notes-file ../release_notes.md \
            $([ "${{ steps.config.outputs.prerelease }}" = "true" ] && echo "--prerelease") \
            --target "${{ github.sha }}" \
            --target "${{ steps.config.outputs.branch }}" \
            || echo "Release may already exist, skipping"
          
          echo "🎉 Release 创建成功: $TAG"