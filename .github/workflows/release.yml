name: Release

on:
  push:
    branches:
      - sync
      - main
      - master
  pull_request:
    types: [closed]
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - stable
      branch:
        description: 'Branch for stable release (only when release_type=stable)'
        required: false
        default: 'main'
        type: string
      repo_filter:
        description: 'Repository filter (optional, leave empty for all)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      repo_names: ${{ steps.set-matrix.outputs.repo_names }}
    steps:
      - name: Checkout code (for config)
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get repository list
        id: set-matrix
        run: |
          if [ -f "release-config.yml" ]; then
            CONFIG_FILE="release-config.yml"
          elif [ -f "../release-config.yml" ]; then
            CONFIG_FILE="../release-config.yml"
          elif [ -f ".github/release-config.yml" ]; then
            CONFIG_FILE=".github/release-config.yml"
          else
            echo "ERROR: 找不到 release-config.yml"
            exit 1
          fi

          REPO_COUNT=$(yq e '.repositories | length' "$CONFIG_FILE")

          INDICES="["
          NAMES="["
          for ((i=0; i<$REPO_COUNT; i++)); do
            NAME=$(yq e ".repositories[$i].name" "$CONFIG_FILE")
            FILTER="${{ github.event.inputs.repo_filter }}"
            if [ -n "$FILTER" ] && [[ "$NAME" != *"$FILTER"* ]]; then
              echo "Skipping $NAME (filter: $FILTER)"
              continue
            fi
            if [ $i -eq 0 ]; then
              INDICES="${INDICES}$i"
              NAMES="${NAMES}\"$NAME\""
            else
              INDICES="${INDICES},$i"
              NAMES="${NAMES},\"$NAME\""
            fi
          done
          INDICES="${INDICES}]"
          NAMES="${NAMES}]"

          echo "matrix={\"repository\":$INDICES}" >> $GITHUB_OUTPUT
          echo "repo_names=$NAMES" >> $GITHUB_OUTPUT

  release:
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"repository":[]}'
    strategy:
      matrix:
        repository: ${{ fromJson(needs.prepare.outputs.matrix).repository }}
      max-parallel: 1
      fail-fast: false
    runs-on: ubuntu-latest
    name: ${{ fromJson(needs.prepare.outputs.repo_names)[matrix.repository] }} (${{ github.event.inputs.release_type || (github.ref_name == 'sync' && 'beta') || ((github.ref_name == 'main' || github.ref_name == 'master') && 'stable') || 'beta' }})

    steps:
      - name: Checkout config
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Determine release type and branch
        id: type
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            REF_NAME="${{ github.ref_name }}"
            if [ "$REF_NAME" = "sync" ]; then
              echo "release_type=beta" >> $GITHUB_OUTPUT
              echo "branch=sync" >> $GITHUB_OUTPUT
              echo "prerelease=true" >> $GITHUB_OUTPUT
            elif [ "$REF_NAME" = "main" ] || [ "$REF_NAME" = "master" ]; then
              echo "release_type=stable" >> $GITHUB_OUTPUT
              echo "branch=$REF_NAME" >> $GITHUB_OUTPUT
              echo "prerelease=false" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            PR_BASE_REF="${{ github.event.pull_request.base.ref }}"
            if [ "$PR_BASE_REF" = "main" ] || [ "$PR_BASE_REF" = "master" ]; then
              echo "release_type=stable" >> $GITHUB_OUTPUT
              echo "branch=$PR_BASE_REF" >> $GITHUB_OUTPUT
              echo "prerelease=false" >> $GITHUB_OUTPUT
            fi
          else
            RELEASE_TYPE="${{ github.event.inputs.release_type }}"
            echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT
            if [ "$RELEASE_TYPE" = "beta" ]; then
              echo "branch=sync" >> $GITHUB_OUTPUT
              echo "prerelease=true" >> $GITHUB_OUTPUT
            else
              BRANCH="${{ github.event.inputs.branch }}"
              if [ -z "$BRANCH" ]; then
                BRANCH="main"
              fi
              echo "branch=$BRANCH" >> $GITHUB_OUTPUT
              echo "prerelease=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Load Configuration
        id: config
        run: |
          if [ -f "release-config.yml" ]; then
            CONFIG_FILE="release-config.yml"
          else
            echo "ERROR: 找不到 release-config.yml"
            exit 1
          fi

          REPO_INDEX=${{ matrix.repository }}
          RELEASE_TYPE="${{ steps.type.outputs.release_type }}"

          NAME=$(yq e ".repositories[$REPO_INDEX].name" "$CONFIG_FILE")
          REPO_PATH=$(yq e ".repositories[$REPO_INDEX].path" "$CONFIG_FILE")
          ENABLED=$(yq e ".repositories[$REPO_INDEX].release.$RELEASE_TYPE.enabled" "$CONFIG_FILE")

          if [ "$ENABLED" != "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Repository $NAME ($RELEASE_TYPE) is disabled, skipping"
            exit 0
          fi

          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "repo_path=$REPO_PATH" >> $GITHUB_OUTPUT

          echo "📦 准备发布: $NAME"
          echo "🏷️ 类型: $RELEASE_TYPE"

      - name: Checkout repository
        if: steps.config.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.config.outputs.repo_path }}
          ref: ${{ steps.type.outputs.branch }}
          path: repo
          fetch-depth: 0

      - name: Read version from _meta.lua
        if: steps.config.outputs.skip != 'true'
        id: meta
        run: |
          cd repo
          VERSION=$(grep -oP '(?<=version = ")[^"]+' _meta.lua | sed 's/^v//')
          if [[ -z "$VERSION" ]]; then
            echo "Error: could not extract version from _meta.lua" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Resolve tag (beta only)
        if: steps.config.outputs.skip != 'true' && steps.type.outputs.release_type == 'beta'
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd repo
          META_VERSION="${{ steps.meta.outputs.version }}"
          BASE="v${META_VERSION}"

          N=1
          while gh release view "${BASE}-beta.${N}" --repo "${{ steps.config.outputs.repo_path }}" > /dev/null 2>&1; do
            N=$((N + 1))
          done
          BETA_TAG="${BASE}-beta.${N}"
          BETA_VERSION="${META_VERSION}-beta.${N}"
          echo "tag=$BETA_TAG" >> $GITHUB_OUTPUT
          echo "version=$BETA_VERSION" >> $GITHUB_OUTPUT

      - name: Stamp beta version in _meta.lua (beta only)
        if: steps.config.outputs.skip != 'true' && steps.type.outputs.release_type == 'beta'
        run: |
          cd repo
          BETA_VERSION="${{ steps.tag.outputs.version }}"
          sed -i "s/version = \"[^\"]*\"/version = \"${BETA_VERSION}\"/" _meta.lua

      - name: Build plugin zip
        if: steps.config.outputs.skip != 'true'
        run: |
          cd repo
          mkdir -p dist
          zip -r dist/${{ steps.config.outputs.name }}.zip . \
            -x "*.git*" \
            -x ".github/*" \
            -x "dist/*" \
            -x "*.zip" \
            -x "picture/*" \
            -x "node_modules/*"

      - name: Build release notes
        if: steps.config.outputs.skip != 'true'
        run: |
          cd repo
          VERSION="${{ steps.meta.outputs.version }}"
          python3 - "$VERSION" <<'PYEOF' > ../release_notes.md
          import re, sys
          version = sys.argv[1]
          try:
              with open("changelog.lua") as f:
                  content = f.read()
              pattern = r'\["' + re.escape(version) + r'"\]\s*=\s*\{([^}]+)\}'
              m = re.search(pattern, content, re.DOTALL)
              if m:
                  block = m.group(1)
                  items = [a or b for a, b in re.findall(r'"([^"]+)"|\'([^\']+)\'', block)]
                  print("## What's Changed\n")
                  for item in items:
                      print(f"- {item}")
              else:
                  print("## What's Changed\n\n_No changelog entries for this version._")
          except FileNotFoundError:
              print("## What's Changed\n\n_`changelog.lua` file not found_")
          PYEOF

      - name: Create Release
        if: steps.config.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd repo
          if [ "${{ steps.type.outputs.release_type }}" = "beta" ]; then
            TAG="${{ steps.tag.outputs.tag }}"
            PRERELEASE="--prerelease"
          else
            TAG="${{ steps.meta.outputs.tag }}"
            PRERELEASE=""
          fi
          
          gh release create "$TAG" \
            dist/${{ steps.config.outputs.name }}.zip \
            --repo "${{ steps.config.outputs.repo_path }}" \
            --title "$TAG" \
            --notes-file ../release_notes.md \
            $PRERELEASE \
            --target "${{ github.sha }}" \
            || echo "⚠️ Release $TAG 可能已存在，跳过创建"
          
          echo "🎉 Release $TAG 处理完成"
