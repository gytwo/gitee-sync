name: Release

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Select repository and release type (leave empty for all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - cloudlibrary.koplugin (beta)
          - cloudlibrary.koplugin (stable)
          - pinyin_enhancement.koplugin (beta)
          - pinyin_enhancement.koplugin (stable)

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: ${{ github.event.inputs.target || 'All repositories' }}
    
    steps:
      - name: Checkout config
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get targets list
        id: targets
        run: |
          INPUT_TARGET="${{ github.event.inputs.target }}"
          
          if [ -z "$INPUT_TARGET" ]; then
            # 用户没选，全部运行
            cat > targets.json << 'EOF'
            [
              {"name": "cloudlibrary.koplugin", "type": "beta"},
              {"name": "cloudlibrary.koplugin", "type": "stable"},
              {"name": "pinyin_enhancement.koplugin", "type": "beta"},
              {"name": "pinyin_enhancement.koplugin", "type": "stable"}
            ]
            EOF
          else
            # 用户选了，只运行选中的
            NAME=$(echo "$INPUT_TARGET" | sed 's/ (.*)//')
            TYPE=$(echo "$INPUT_TARGET" | sed 's/.*(\(.*\))/\1/')
            cat > targets.json << EOF
            [{"name": "$NAME", "type": "$TYPE"}]
            EOF
          fi
          
          echo "targets=$(cat targets.json | jq -c .)" >> $GITHUB_OUTPUT

      - name: Run for each target
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TARGETS='${{ steps.targets.outputs.targets }}'
          echo "$TARGETS" | jq -c '.[]' | while read item; do
            NAME=$(echo "$item" | jq -r '.name')
            RELEASE_TYPE=$(echo "$item" | jq -r '.type')
            
            echo ""
            echo "=========================================="
            echo "处理: $NAME ($RELEASE_TYPE)"
            echo "=========================================="
            
            # 读取配置
            CONFIG_FILE="release-config.yml"
            
            # 找到对应仓库的索引
            REPO_INDEX=$(yq e ".repositories | map(.name == \"$NAME\") | index(true)" "$CONFIG_FILE")
            if [ -z "$REPO_INDEX" ] || [ "$REPO_INDEX" = "null" ]; then
              echo "❌ 找不到仓库 $NAME"
              continue
            fi
            
            REPO_PATH=$(yq e ".repositories[$REPO_INDEX].path" "$CONFIG_FILE")
            BRANCH=$(yq e ".repositories[$REPO_INDEX].release.$RELEASE_TYPE.branch" "$CONFIG_FILE")
            ENABLED=$(yq e ".repositories[$REPO_INDEX].release.$RELEASE_TYPE.enabled" "$CONFIG_FILE")
            PRERELEASE=$(yq e ".repositories[$REPO_INDEX].release.$RELEASE_TYPE.prerelease // false" "$CONFIG_FILE")
            
            if [ "$ENABLED" != "true" ]; then
              echo "⏭️  $NAME ($RELEASE_TYPE) 已禁用，跳过"
              continue
            fi
            
            echo "📦 仓库: $REPO_PATH"
            echo "🌿 分支: $BRANCH"
            echo "🏷️  预发布: $PRERELEASE"
            
            # 检查是否有新提交
            LAST_COMMIT_TIME_UTC=$(gh api repos/$REPO_PATH/commits/$BRANCH --jq '.commit.committer.date')
            
            if [ "$PRERELEASE" = "true" ]; then
              LAST_RELEASE_TIME_UTC=$(gh api repos/$REPO_PATH/releases --jq '[.[] | select(.prerelease == true) | .published_at][0]' 2>/dev/null || echo "")
            else
              LAST_RELEASE_TIME_UTC=$(gh api repos/$REPO_PATH/releases --jq '[.[] | select(.prerelease == false) | .published_at][0]' 2>/dev/null || echo "")
            fi
            
            if [ -z "$LAST_RELEASE_TIME_UTC" ]; then
              echo "✅ 没有找到任何 release，将发布"
            elif [ -n "$LAST_COMMIT_TIME_UTC" ] && [ "$LAST_COMMIT_TIME_UTC" \> "$LAST_RELEASE_TIME_UTC" ]; then
              echo "✅ 检测到新的 commit，将发布"
            else
              echo "⏭️  没有新的 commit，跳过发布"
              continue
            fi
            
            # 检出仓库
            git clone "https://$GH_TOKEN@github.com/$REPO_PATH.git" repo
            cd repo
            git checkout "$BRANCH"
            
            # 读取版本号
            VERSION=$(grep -oP '(?<=version = ")[^"]+' _meta.lua | sed 's/^v//')
            if [[ -z "$VERSION" ]]; then
              echo "❌ 无法从 _meta.lua 提取版本号"
              cd ..
              rm -rf repo
              continue
            fi
            echo "📌 版本号: $VERSION"
            
            # 处理 beta 标签
            if [ "$PRERELEASE" = "true" ]; then
              BASE="v${VERSION}"
              N=1
              while gh release view "${BASE}-beta.${N}" --repo "$REPO_PATH" > /dev/null 2>&1; do
                N=$((N + 1))
              done
              BETA_TAG="${BASE}-beta.${N}"
              echo "🔖 Beta 标签: $BETA_TAG"
              
              # 修改 _meta.lua 中的版本号
              sed -i "s/version = \"[^\"]*\"/version = \"${BETA_TAG}\"/" _meta.lua
              TAG="$BETA_TAG"
              PRERELEASE_FLAG="--prerelease"
            else
              TAG="v${VERSION}"
              PRERELEASE_FLAG=""
            fi
            
            # 打包
            mkdir -p dist
            zip -r dist/${NAME}.zip . \
              -x "*.git*" \
              -x ".github/*" \
              -x "dist/*" \
              -x "*.zip" \
              -x "picture/*" \
              -x "node_modules/*"
            
            # 生成 release notes
            python3 - "$VERSION" <<'PYEOF' > ../release_notes.md
            import re, sys
            version = sys.argv[1]
            try:
                with open("changelog.lua") as f:
                    content = f.read()
                pattern = r'\["' + re.escape(version) + r'"\]\s*=\s*\{([^}]+)\}'
                m = re.search(pattern, content, re.DOTALL)
                if m:
                    block = m.group(1)
                    items = [a or b for a, b in re.findall(r'"([^"]+)"|\'([^\']+)\'', block)]
                    print("## What's Changed\n")
                    for item in items:
                        print(f"- {item}")
                else:
                    print("## What's Changed\n\n_No changelog entries for this version._")
            except FileNotFoundError:
                print("## What's Changed\n\n_`changelog.lua` file not found_")
            PYEOF
            
            # 创建 release
            if gh release view "$TAG" --repo "$REPO_PATH" > /dev/null 2>&1; then
              echo "⚠️  Release $TAG 已存在，跳过创建"
            else
              echo "🚀 创建 Release: $TAG"
              gh release create "$TAG" \
                dist/${NAME}.zip \
                --repo "$REPO_PATH" \
                --title "$TAG" \
                --notes-file ../release_notes.md \
                $PRERELEASE_FLAG
              echo "✅ Release $TAG 创建成功"
            fi
            
            cd ..
            rm -rf repo
            echo "✅ 完成: $NAME ($RELEASE_TYPE)"
          done
