name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - stable
      repo_filter:
        description: 'Repository filter (optional, leave empty for all)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      repo_names: ${{ steps.set-matrix.outputs.repo_names }}
    steps:
      - name: Checkout code (for config)
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get repository list
        id: set-matrix
        run: |
          if [ -f "release-config.yml" ]; then
            CONFIG_FILE="release-config.yml"
          elif [ -f "../release-config.yml" ]; then
            CONFIG_FILE="../release-config.yml"
          elif [ -f ".github/release-config.yml" ]; then
            CONFIG_FILE=".github/release-config.yml"
          else
            echo "ERROR: 找不到 release-config.yml"
            exit 1
          fi

          REPO_COUNT=$(yq e '.repositories | length' "$CONFIG_FILE")

          INDICES="["
          NAMES="["
          for ((i=0; i<$REPO_COUNT; i++)); do
            NAME=$(yq e ".repositories[$i].name" "$CONFIG_FILE")
            FILTER="${{ github.event.inputs.repo_filter }}"
            if [ -n "$FILTER" ] && [[ "$NAME" != *"$FILTER"* ]]; then
              echo "Skipping $NAME (filter: $FILTER)"
              continue
            fi
            if [ $i -eq 0 ]; then
              INDICES="${INDICES}$i"
              NAMES="${NAMES}\"$NAME\""
            else
              INDICES="${INDICES},$i"
              NAMES="${NAMES},\"$NAME\""
            fi
          done
          INDICES="${INDICES}]"
          NAMES="${NAMES}]"

          echo "matrix={\"repository\":$INDICES}" >> $GITHUB_OUTPUT
          echo "repo_names=$NAMES" >> $GITHUB_OUTPUT

  release:
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"repository":[]}'
    strategy:
      matrix:
        repository: ${{ fromJson(needs.prepare.outputs.matrix).repository }}
      max-parallel: 1
      fail-fast: false
    runs-on: ubuntu-latest
    name: ${{ fromJson(needs.prepare.outputs.repo_names)[matrix.repository] }} (${{ github.event.inputs.release_type }})

    steps:
      - name: Checkout config
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Load Configuration
        id: config
        run: |
          if [ -f "release-config.yml" ]; then
            CONFIG_FILE="release-config.yml"
          elif [ -f "../release-config.yml" ]; then
            CONFIG_FILE="../release-config.yml"
          elif [ -f ".github/release-config.yml" ]; then
            CONFIG_FILE=".github/release-config.yml"
          else
            echo "ERROR: 找不到 release-config.yml"
            exit 1
          fi

          REPO_INDEX=${{ matrix.repository }}
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"

          NAME=$(yq e ".repositories[$REPO_INDEX].name" "$CONFIG_FILE")
          REPO_PATH=$(yq e ".repositories[$REPO_INDEX].path" "$CONFIG_FILE")
          ENABLED=$(yq e ".repositories[$REPO_INDEX].release.$RELEASE_TYPE.enabled" "$CONFIG_FILE")

          if [ "$ENABLED" != "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Repository $NAME ($RELEASE_TYPE) is disabled, skipping"
            exit 0
          fi

          BRANCH=$(yq e ".repositories[$REPO_INDEX].release.$RELEASE_TYPE.branch" "$CONFIG_FILE")
          PRERELEASE=$(yq e ".repositories[$REPO_INDEX].release.$RELEASE_TYPE.prerelease // true" "$CONFIG_FILE")

          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "repo_path=$REPO_PATH" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

          echo "📦 准备发布: $NAME"
          echo "🔖 分支: $BRANCH"
          echo "🏷️ 类型: $RELEASE_TYPE"

      - name: Checkout repository
        if: steps.config.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.config.outputs.repo_path }}
          ref: ${{ steps.config.outputs.branch }}
          path: repo
          fetch-depth: 0

      - name: Read version and changelog
        if: steps.config.outputs.skip != 'true'
        id: version
        run: |
          cd repo
          
          # 读取版本号
          VERSION=$(grep -oP '(?<=version = ")[^"]+' _meta.lua | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          
          # 提取更新日志
          python3 - "$VERSION" <<'PYEOF' > ../release_notes.md
          import re, sys
          version = sys.argv[1]
          with open("changelog.lua") as f:
              content = f.read()
          pattern = r'\["' + re.escape(version) + r'"\]\s*=\s*\{([^}]+)\}'
          m = re.search(pattern, content, re.DOTALL)
          if m:
              block = m.group(1)
              items = [a or b for a, b in re.findall(r'"([^"]+)"|\'([^\']+)\'', block)]
              print("## What's Changed\n")
              for item in items:
                  print(f"- {item}")
          else:
              print("## What's Changed\n\n_No changelog entries for this version._")
          PYEOF

      - name: Build plugin zip
        if: steps.config.outputs.skip != 'true'
        run: |
          cd repo
          mkdir -p dist
          zip -r dist/${{ steps.config.outputs.name }}.zip . \
            -x "*.git*" \
            -x ".github/*" \
            -x "dist/*" \
            -x "*.zip" \
            -x "picture/*" \
            -x "node_modules/*"
          echo "✅ 打包完成"

      - name: Create Release
        if: steps.config.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd repo
          TAG="v${{ steps.version.outputs.version }}"
          
          # 如果是 beta 版本，添加 beta 序号
          if [ "${{ steps.config.outputs.prerelease }}" = "true" ]; then
            MAX_BETA=0
            for t in $(git tag -l "v${{ steps.version.outputs.version }}-beta.*"); do
              num=$(echo "$t" | grep -oP 'beta\.\K\d+')
              if [ -n "$num" ] && [ "$num" -gt "$MAX_BETA" ]; then
                MAX_BETA=$num
              fi
            done
            N=$((MAX_BETA + 1))
            TAG="v${{ steps.version.outputs.version }}-beta.$N"
          fi
          
          gh release create "$TAG" \
            dist/${{ steps.config.outputs.name }}.zip \
            --repo "${{ steps.config.outputs.repo_path }}" \
            --title "$TAG" \
            --notes-file ../release_notes.md \
            $([ "${{ steps.config.outputs.prerelease }}" = "true" ] && echo "--prerelease") \
            || echo "⚠️ Release $TAG 可能已存在，跳过创建"
          
          echo "🎉 Release $TAG 处理完成"
