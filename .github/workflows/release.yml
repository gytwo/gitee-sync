name: Release

on:
  schedule:
    # 每6小时检查一次
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - stable
      repo_filter:
        description: 'Repository filter (optional, leave empty for all)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      repo_names: ${{ steps.set-matrix.outputs.repo_names }}
    steps:
      - name: Checkout code (for config)
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get repository list
        id: set-matrix
        run: |
          if [ -f "release-config.yml" ]; then
            CONFIG_FILE="release-config.yml"
          else
            echo "ERROR: 找不到 release-config.yml"
            exit 1
          fi

          REPO_COUNT=$(yq e '.repositories | length' "$CONFIG_FILE")

          INDICES="["
          NAMES="["
          for ((i=0; i<$REPO_COUNT; i++)); do
            NAME=$(yq e ".repositories[$i].name" "$CONFIG_FILE")
            FILTER="${{ github.event.inputs.repo_filter }}"
            if [ -n "$FILTER" ] && [[ "$NAME" != *"$FILTER"* ]]; then
              echo "Skipping $NAME (filter: $FILTER)"
              continue
            fi
            if [ $i -eq 0 ]; then
              INDICES="${INDICES}$i"
              NAMES="${NAMES}\"$NAME\""
            else
              INDICES="${INDICES},$i"
              NAMES="${NAMES},\"$NAME\""
            fi
          done
          INDICES="${INDICES}]"
          NAMES="${NAMES}]"

          echo "matrix={\"repository\":$INDICES}" >> $GITHUB_OUTPUT
          echo "repo_names=$NAMES" >> $GITHUB_OUTPUT

  release:
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"repository":[]}'
    strategy:
      matrix:
        repository: ${{ fromJson(needs.prepare.outputs.matrix).repository }}
        release_type:
          - beta
          - stable
      max-parallel: 1
      fail-fast: false
    runs-on: ubuntu-latest
    name: ${{ fromJson(needs.prepare.outputs.repo_names)[matrix.repository] }} (${{ matrix.release_type }})

    steps:
      - name: Checkout config
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set branch and prerelease
        id: type
        run: |
          if [ "${{ matrix.release_type }}" = "beta" ]; then
            echo "branch=sync" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "branch=main" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Load Configuration
        id: config
        run: |
          if [ -f "release-config.yml" ]; then
            CONFIG_FILE="release-config.yml"
          else
            echo "ERROR: 找不到 release-config.yml"
            exit 1
          fi

          REPO_INDEX=${{ matrix.repository }}
          RELEASE_TYPE="${{ matrix.release_type }}"

          NAME=$(yq e ".repositories[$REPO_INDEX].name" "$CONFIG_FILE")
          REPO_PATH=$(yq e ".repositories[$REPO_INDEX].path" "$CONFIG_FILE")
          ENABLED=$(yq e ".repositories[$REPO_INDEX].release.$RELEASE_TYPE.enabled" "$CONFIG_FILE")

          if [ "$ENABLED" != "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Repository $NAME ($RELEASE_TYPE) is disabled, skipping"
            exit 0
          fi

          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "repo_path=$REPO_PATH" >> $GITHUB_OUTPUT

      - name: Check for changes
        if: steps.config.outputs.skip != 'true'
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          REPO_PATH="${{ steps.config.outputs.repo_path }}"
          BRANCH="${{ steps.type.outputs.branch }}"
          
          # 获取分支最后一次 commit 的时间
          LAST_COMMIT_TIME=$(gh api repos/$REPO_PATH/commits/$BRANCH --jq '.commit.committer.date')
          
          # 获取该分支最后一次 release 的时间
          RELEASES=$(gh release list --repo "$REPO_PATH" --limit 10 --json tagName,createdAt)
          LAST_RELEASE_TIME=""
          for tag in $(echo "$RELEASES" | jq -r '.[].tagName'); do
            TAG_COMMIT_TIME=$(gh api repos/$REPO_PATH/commits/$tag --jq '.commit.committer.date' 2>/dev/null || echo "")
            if [ -n "$TAG_COMMIT_TIME" ]; then
              LAST_RELEASE_TIME="$TAG_COMMIT_TIME"
              break
            fi
          done
          
          echo "分支: $BRANCH"
          echo "最后一次 commit 时间: $LAST_COMMIT_TIME"
          echo "最后一次 release 时间: $LAST_RELEASE_TIME"
          
          if [ -z "$LAST_RELEASE_TIME" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "没有找到任何 release，将发布"
          elif [ "$LAST_COMMIT_TIME" \> "$LAST_RELEASE_TIME" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "检测到新的 commit，将发布"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "没有新的 commit，跳过发布"
          fi

      - name: Checkout repository
        if: steps.config.outputs.skip != 'true' && steps.check.outputs.has_changes == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.config.outputs.repo_path }}
          ref: ${{ steps.type.outputs.branch }}
          path: repo
          fetch-depth: 0

      - name: Read version from _meta.lua
        if: steps.config.outputs.skip != 'true' && steps.check.outputs.has_changes == 'true'
        id: meta
        run: |
          cd repo
          VERSION=$(grep -oP '(?<=version = ")[^"]+' _meta.lua | sed 's/^v//')
          if [[ -z "$VERSION" ]]; then
            echo "Error: could not extract version from _meta.lua" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Resolve tag (beta only)
        if: steps.config.outputs.skip != 'true' && steps.check.outputs.has_changes == 'true' && steps.type.outputs.prerelease == 'true'
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd repo
          META_VERSION="${{ steps.meta.outputs.version }}"
          BASE="v${META_VERSION}"

          N=1
          while gh release view "${BASE}-beta.${N}" --repo "${{ steps.config.outputs.repo_path }}" > /dev/null 2>&1; do
            N=$((N + 1))
          done
          echo "tag=${BASE}-beta.${N}" >> $GITHUB_OUTPUT

      - name: Stamp beta version in _meta.lua (beta only)
        if: steps.config.outputs.skip != 'true' && steps.check.outputs.has_changes == 'true' && steps.type.outputs.prerelease == 'true'
        run: |
          cd repo
          BETA_VERSION="${{ steps.tag.outputs.tag }}"
          sed -i "s/version = \"[^\"]*\"/version = \"${BETA_VERSION}\"/" _meta.lua

      - name: Build plugin zip
        if: steps.config.outputs.skip != 'true' && steps.check.outputs.has_changes == 'true'
        run: |
          cd repo
          mkdir -p dist
          zip -r dist/${{ steps.config.outputs.name }}.zip . \
            -x "*.git*" \
            -x ".github/*" \
            -x "dist/*" \
            -x "*.zip" \
            -x "picture/*" \
            -x "node_modules/*"

      - name: Build release notes
        if: steps.config.outputs.skip != 'true' && steps.check.outputs.has_changes == 'true'
        run: |
          cd repo
          VERSION="${{ steps.meta.outputs.version }}"
          python3 - "$VERSION" <<'PYEOF' > ../release_notes.md
          import re, sys
          version = sys.argv[1]
          try:
              with open("changelog.lua") as f:
                  content = f.read()
              pattern = r'\["' + re.escape(version) + r'"\]\s*=\s*\{([^}]+)\}'
              m = re.search(pattern, content, re.DOTALL)
              if m:
                  block = m.group(1)
                  items = [a or b for a, b in re.findall(r'"([^"]+)"|\'([^\']+)\'', block)]
                  print("## What's Changed\n")
                  for item in items:
                      print(f"- {item}")
              else:
                  print("## What's Changed\n\n_No changelog entries for this version._")
          except FileNotFoundError:
              print("## What's Changed\n\n_`changelog.lua` file not found_")
          PYEOF

      - name: Create Release
        if: steps.config.outputs.skip != 'true' && steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd repo
          if [ "${{ steps.type.outputs.prerelease }}" = "true" ]; then
            TAG="${{ steps.tag.outputs.tag }}"
            PRERELEASE="--prerelease"
          else
            TAG="${{ steps.meta.outputs.tag }}"
            PRERELEASE=""
          fi
          
          gh release create "$TAG" \
            dist/${{ steps.config.outputs.name }}.zip \
            --repo "${{ steps.config.outputs.repo_path }}" \
            --title "$TAG" \
            --notes-file ../release_notes.md \
            $PRERELEASE \
            || echo "⚠️ Release $TAG 可能已存在，跳过创建"
          
          echo "🎉 Release $TAG 处理完成"
