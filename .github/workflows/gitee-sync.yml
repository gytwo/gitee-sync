name: Sync from Gitee to GitHub
env:
  TZ: 'Asia/Shanghai'

on:
  workflow_dispatch:  # 支持手动触发
  schedule:
    # 每月2000分钟免费额度，可以根据执行时长调整频率。
    # 在东八区的 14:00, 22:00, 23:00, 24:00 运行
    # 对应 UTC 的 06:00, 14:00, 15:00, 16:00
    - cron: '0 6,14,15,16 * * *'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      repo_names: ${{ steps.set-matrix.outputs.repo_names }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get repository count
        id: set-matrix
        run: |
          # 获取仓库数量
          REPO_COUNT=$(yq e '.repositories | length' sync-config.yml)
          
          # 创建索引数组和名称数组
          INDICES="["
          NAMES="["
          for ((i=0; i<$REPO_COUNT; i++)); do
            NAME=$(yq e ".repositories[$i].name" sync-config.yml)
            if [ $i -eq 0 ]; then
              INDICES="${INDICES}$i"
              NAMES="${NAMES}\"$NAME\""
            else
              INDICES="${INDICES},$i"
              NAMES="${NAMES},\"$NAME\""
            fi
          done
          INDICES="${INDICES}]"
          NAMES="${NAMES}]"
          
          echo "matrix={\"repository\":$INDICES}" >> $GITHUB_OUTPUT
          echo "repo_names=$NAMES" >> $GITHUB_OUTPUT

  sync:
    needs: prepare
    strategy:
      matrix: 
        repository: ${{ fromJson(needs.prepare.outputs.matrix).repository }}
      max-parallel: 1  # 避免分支名冲突
      fail-fast: false  # 某个仓库同步失败不影响其他仓库
    runs-on: ubuntu-latest
    name: ${{ fromJson(needs.prepare.outputs.repo_names)[matrix.repository] }}
    
    steps:
      - name: Checkout code (for config)
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Load Configuration
        id: config
        run: |
          # 读取配置文件中指定索引的仓库配置
          echo "正在读取配置文件..."
          REPO_INDEX=${{ matrix.repository }}
          
          GITEE_REPO_URL=$(yq e ".repositories[$REPO_INDEX].gitee.repo_url" sync-config.yml)
          GITEE_BRANCH=$(yq e ".repositories[$REPO_INDEX].gitee.branch" sync-config.yml)
          GITHUB_REPO_NAME=$(yq e ".repositories[$REPO_INDEX].github.repo_name" sync-config.yml)
          GITHUB_BRANCH=$(yq e ".repositories[$REPO_INDEX].github.branch // .repositories[$REPO_INDEX].gitee.branch" sync-config.yml)
          GITHUB_PRIVATE=$(yq e ".repositories[$REPO_INDEX].github.private // false" sync-config.yml)
          SYNC_NAME=$(yq e ".repositories[$REPO_INDEX].name" sync-config.yml)
          
          # 设置输出变量
          echo "gitee_repo_url=$GITEE_REPO_URL" >> $GITHUB_OUTPUT
          echo "gitee_branch=$GITEE_BRANCH" >> $GITHUB_OUTPUT
          echo "github_repo_name=$GITHUB_REPO_NAME" >> $GITHUB_OUTPUT
          echo "github_branch=$GITHUB_BRANCH" >> $GITHUB_OUTPUT
          echo "github_private=$GITHUB_PRIVATE" >> $GITHUB_OUTPUT
          echo "sync_name=$SYNC_NAME" >> $GITHUB_OUTPUT

      - name: Check and Create Repository
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPO: ${{ steps.config.outputs.github_repo_name }}
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_PRIVATE: ${{ steps.config.outputs.github_private }}
        run: |
          echo "🔍 正在检查 GitHub 仓库是否存在..."
          REPO_EXISTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_USER/$GITHUB_REPO" | jq -r '.id // empty')
          
          if [ -z "$REPO_EXISTS" ]; then
            echo "📦 仓库不存在，开始创建新仓库..."
            curl -X POST -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/user/repos \
              -d "{\"name\":\"$GITHUB_REPO\", \"private\":$GITHUB_PRIVATE}"
            echo "✨ 仓库创建成功！"
            # 等待 GitHub 完成仓库初始化
            echo "⏳ 等待仓库初始化（10秒）..."
            sleep 10
          else
            echo "✅ 仓库已存在，检查并更新可见性设置..."
            # 更新已存在仓库的可见性
            curl -X PATCH -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$GITHUB_USER/$GITHUB_REPO" \
              -d "{\"private\":$GITHUB_PRIVATE}"
            echo "✨ 仓库可见性已更新！"
          fi

      - name: Sync Repository
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITEE_REPO_URL: ${{ steps.config.outputs.gitee_repo_url }}
          GITEE_BRANCH: ${{ steps.config.outputs.gitee_branch }}
          GITHUB_REPO: ${{ steps.config.outputs.github_repo_name }}
          GITHUB_BRANCH: ${{ steps.config.outputs.github_branch }}
          GITHUB_USER: ${{ github.repository_owner }}
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_PASSWORD: ${{ secrets.GITEE_PASSWORD }}
        run: |
          echo "🔧 配置 Git 用户信息..."
          git config --global user.name "gytwo"
          git config --global user.email "15279172411@163.com"
          
          echo "📥 下载 Gitee 仓库的最终代码..."
          GITEE_AUTH_URL=$(echo "$GITEE_REPO_URL" | sed "s|https://|https://$GITEE_USERNAME:$GITEE_PASSWORD@|")
          git clone --depth 1 -b "$GITEE_BRANCH" "$GITEE_AUTH_URL" gitee_temp
          
          if [ $? -ne 0 ]; then
            echo "❌ 下载 Gitee 代码失败"
            exit 1
          fi
          
          echo "📥 克隆 GitHub 仓库..."
          git clone "https://$GH_TOKEN@github.com/$GITHUB_USER/$GITHUB_REPO.git" github_repo
          
          if [ $? -ne 0 ]; then
            echo "❌ 克隆 GitHub 仓库失败"
            exit 1
          fi
          
          cd github_repo
          
          # 获取远程默认分支（自动检测 main 或 master，不硬编码）
          DEFAULT_BRANCH=$(git remote show origin | grep "HEAD branch" | sed 's/.*: //' || echo "main")
          echo "📌 远程默认分支: ${DEFAULT_BRANCH}"
          
          # 处理空仓库的情况（使用检测到的默认分支）
          if ! git branch -a | grep -q .; then
            echo "🆕 检测到空仓库，正在初始化..."
            git checkout --orphan "${DEFAULT_BRANCH}"
            echo "# ${GITHUB_REPO}" >> README.md
            git add README.md
            git commit -m "first commit"
            git push -u origin "${DEFAULT_BRANCH}"
            echo "✅ 空仓库已初始化，默认分支: ${DEFAULT_BRANCH}"
          fi
          
          # 切换到目标分支（使用变量，不硬编码）
          echo "🔍 确保在分支 '${GITHUB_BRANCH}' 上操作..."
          
          if git ls-remote --heads origin "${GITHUB_BRANCH}" | grep -q "${GITHUB_BRANCH}"; then
            echo "分支 '${GITHUB_BRANCH}' 在远程存在，正在切换..."
            git checkout "${GITHUB_BRANCH}"
          else
            echo "分支 '${GITHUB_BRANCH}' 不存在，基于 ${DEFAULT_BRANCH} 创建..."
            git checkout "${DEFAULT_BRANCH}"
            git checkout -b "${GITHUB_BRANCH}"
            git push -u origin "${GITHUB_BRANCH}"
          fi
          
          echo "📍 当前工作分支: $(git branch --show-current)"
          
          # 用 git archive 导出 Gitee 代码（直接覆盖，不清空）
          echo "📋 用 git archive 导出 Gitee 代码（不含 .git）..."
          cd ../gitee_temp
          git archive --format=tar HEAD | (cd ../github_repo && tar xf -)
          cd ../github_repo
          
          echo "📊 检测所有变化（包括修改、新增、删除）..."
          git add .
          git add -u
          
          # 检查是否有变化
          if git diff --cached --quiet; then
            echo "✨ 没有检测到任何文件变化，无需提交"
          else
            echo "📝 检测到变化，按文件分别提交..."
            
            # 获取变更的文件列表
            CHANGED_FILES=$(git diff --cached --name-only)
            
            # 逐个文件提交
            for file in $CHANGED_FILES; do
              # 只添加当前文件
              git reset HEAD > /dev/null 2>&1
              git add "$file"
              
              # 获取该文件在 Gitee 中的最后一次提交注释
              if [ -f "../gitee_temp/$file" ]; then
                LAST_COMMIT_MSG=$(cd ../gitee_temp && git log -1 --format=%s -- "$file" 2>/dev/null || echo "更新 $file")
              else
                LAST_COMMIT_MSG="更新 $file"
              fi
              
              # 提交当前文件
              git commit -m "$LAST_COMMIT_MSG"
              echo "✅ 已提交: $file -> $LAST_COMMIT_MSG"
            done
            
            echo "✅ 所有文件提交成功 (分支: $(git branch --show-current))"
          fi
          
          echo "⬆️ 推送到 GitHub (分支: ${GITHUB_BRANCH})..."
          git push origin "${GITHUB_BRANCH}"
          
          cd ..
          rm -rf gitee_temp github_repo
          
          echo "🎉 同步完成！"
          echo "📝 GitHub 上的原有提交记录已全部保留"
